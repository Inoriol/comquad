name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/comquad/

      - name: Vet
        run: go vet ./...

      - name: Unit tests (short)
        run: go test -short -count=1 -timeout 2m ./...

      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout 3m ./...

      - name: Unit tests with coverage
        run: go test -cover -coverprofile=coverage.out -count=1 -timeout 2m ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out
