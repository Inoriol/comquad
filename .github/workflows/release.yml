name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cockpit-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: cockpit-comquad/package-lock.json

      - name: Build cockpit-comquad
        run: |
          cd cockpit-comquad
          npm ci
          npm run build

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p cockpit-comquad-${VERSION}
          cp -r cockpit-comquad/dist cockpit-comquad-${VERSION}/
          cp cockpit-comquad/src/manifest.json cockpit-comquad-${VERSION}/
          cp cockpit-comquad/Makefile cockpit-comquad-${VERSION}/
          cp cockpit-comquad/README.md cockpit-comquad-${VERSION}/
          cp LICENSE cockpit-comquad-${VERSION}/
          tar -czf cockpit-comquad-${VERSION}.tar.gz cockpit-comquad-${VERSION}
          echo "TARBALL=cockpit-comquad-${VERSION}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-comquad-tarball
          path: cockpit-comquad-*.tar.gz

  goreleaser:
    runs-on: ubuntu-latest
    needs: cockpit-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: cockpit-comquad-tarball
          path: dist

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
